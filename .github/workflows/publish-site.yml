name: "[prod] Publish static site"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Clone current repo
      - name: Checkout
        uses: actions/checkout@v3
        # with:
          # path: src
          # ref: develop # <-- required to deploy beta docs

      # Set up for DocFX
      - name: Setup .NET Core SDK 7.0.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            7.0.x
      - name: Setup NuGet
        uses: Nuget/setup-nuget@v1.0.5
      - name: Install DocFX globally
        run: |
          dotnet tool install --global docfx
      - name: Install DocFxMarkdownGen
        run: |
          dotnet tool install --global DocFxMarkdownGen
      - name: Run DocFX
        run: |
          docfx docfx/docfx.json
      - name: Run DocFxMarkdownGen (dfmg) to generate API .md files
        # dfmg uses config.yaml for input/output paths
        run: |
          dfmg

      # Set up for GitHub Pages build
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
